# Minimal validation workflow — mirrors `npm run validate` locally.
# No secrets, no external provider calls, no deployment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create temporary local SQLite database
        run: npx prisma migrate deploy

      - name: Seed deterministic demo data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
